name: Test isolated Cloudflare recovery

on:
  workflow_run:
    workflows: ['Verify external watchdog observation']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-isolated-cloudflare-recovery
  cancel-in-progress: false

jobs:
  canary:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test external_watchdog/test/*.test.mjs watchdog_verification/test/*.test.mjs
      - name: Verify the credentials without printing values
        id: access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WATCHDOG_GITHUB_TOKEN: ${{ secrets.WATCHDOG_GITHUB_TOKEN }}
        run: node external_watchdog/deployment-preflight.mjs
      - name: Select the disposable canary from the exact observed source commit
        id: target
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          WATCHDOG_GITHUB_TOKEN: ${{ secrets.WATCHDOG_GITHUB_TOKEN }}
        run: node watchdog_verification/canary-tools.mjs prepare
      - name: Deploy the temporary isolated recovery Worker
        if: steps.access.outputs.ready == 'true'
        id: deployed
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.access.outputs.account_id }}
          workingDirectory: watchdog_verification
          command: deploy
          secrets: |
            GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.WATCHDOG_GITHUB_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Verify that Cloudflare recovers only the failed isolated save job
        if: steps.deployed.outcome == 'success'
        env:
          CANARY_RUN_ID: ${{ steps.target.outputs.run_id }}
          CANARY_COLLECTOR_ID: ${{ steps.target.outputs.collect_id }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          WATCHDOG_GITHUB_TOKEN: ${{ secrets.WATCHDOG_GITHUB_TOKEN }}
        run: node watchdog_verification/canary-tools.mjs wait
      - name: Stop only the test Worker's Cron and remove its credential copy
        if: always() && steps.access.outputs.ready == 'true' && (steps.deployed.outcome == 'success' || steps.deployed.outcome == 'failure')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node watchdog_verification/canary-tools.mjs cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-cloudflare-recovery
          path: watchdog-canary-recovery.json
          if-no-files-found: ignore
          retention-days: 7
