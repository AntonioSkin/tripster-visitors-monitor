name: Twice-daily full calendar history
on:
  schedule:
    - cron: '0 6,15 * * *'
    - cron: '20,40 6,7,15,16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'calendar_history/**'
      - '.github/workflows/calendar-history.yml'
      - 'workflow_support/**'
      - '.github/workflows/save-monitor-results.yml'
permissions:
  contents: write
concurrency:
  group: tripster-task-3
  queue: max
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.upload.outcome == 'success' && steps.package.outputs.changed == 'true' }}
      artifact: ${{ steps.package.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test history rules
        run: python -m unittest calendar_history.test_monitor calendar_history.test_combined seats.test_monitor -v
      - name: Check measurement gate
        id: gate
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from calendar_history.combined import due_observation, TZ
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"run={str(due_observation(datetime.now(TZ)) is not None).lower()}\n")
          PY
      - name: Install browser
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Snapshot full calendar and send summary
        if: steps.gate.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m calendar_history.monitor
      - name: Package changed task 3 data and delivery state
        id: package
        if: always()
        run: python -m workflow_support.persistence export --task 3 --directory "$RUNNER_TEMP/monitor-bundle"
      - name: Preserve results for the serialized writer
        id: upload
        if: ${{ always() && steps.package.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ runner.temp }}/monitor-bundle/
          if-no-files-found: error
          retention-days: 14
  save:
    needs: history
    if: ${{ always() && needs.history.outputs.changed == 'true' }}
    uses: ./.github/workflows/save-monitor-results.yml
    with:
      task: '3'
      artifact: ${{ needs.history.outputs.artifact }}
    secrets:
      HEALTHCHECKS_API_KEY: ${{ secrets.HEALTHCHECKS_API_KEY }}
