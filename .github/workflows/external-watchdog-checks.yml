name: External watchdog checks

on:
  push:
    paths: ['external_watchdog/**', 'watchdog_verification/**', '.github/workflows/external-watchdog-checks.yml']
  pull_request:
    paths: ['external_watchdog/**', 'watchdog_verification/**', '.github/workflows/external-watchdog-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate controller safety and observation
        run: node --test external_watchdog/test/*.test.mjs watchdog_verification/test/*.test.mjs
      - name: Install the pinned Workers test runtime
        run: npm install --no-save --no-package-lock wrangler@4.158.0
      - name: Verify native Workers fetch without network access or credentials
        run: node watchdog_verification/runtime-test.mjs
