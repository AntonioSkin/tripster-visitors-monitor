name: External watchdog checks
on:
  push:
    branches: [cloudflare/reconcile-recovery-proof]
    paths: ['.github/workflows/external-watchdog-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify fifteen-minute recovery without publishing task data or creating artifacts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node --input-type=module <<'JS'
          import {spawn} from 'node:child_process';
          import assert from 'node:assert/strict';
          import {jsonStream} from './watchdog_verification/json-stream.mjs';
          const account='2e77b8a5ee65cf11fd41037a4aa07904',worker='tripster-external-watchdog';
          const root='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/'+worker;
          const response=await fetch(root+'/settings',{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},redirect:'error',signal:AbortSignal.timeout(15000)});
          assert.equal(response.status,200);
          const bindings=(await response.json()).result.bindings;
          assert.equal(bindings.find(b=>b.name==='MODE')?.text,'recover');
          const allow=bindings.find(b=>b.name==='RECOVERY_ALLOWLIST')?.text.split(',');
          assert.deepEqual([...allow].sort(),['1','2','3','4','5','6','7']);
          console.log('RECOVERY_MODE_CONFIGURATION_VERIFIED');
          const schedulesResponse=await fetch(root+'/schedules',{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},redirect:'error',signal:AbortSignal.timeout(15000)});
          assert.equal(schedulesResponse.status,200);
          const schedules=(await schedulesResponse.json()).result.schedules;
          assert.deepEqual(schedules.map(s=>s.cron),['*/15 * * * *']);
          console.log('FIFTEEN_MINUTE_SCHEDULE_CONFIGURATION_VERIFIED');
          const scriptResponse=await fetch(root,{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},redirect:'error',signal:AbortSignal.timeout(15000)});
          assert.equal(scriptResponse.status,200);
          assert.equal(/MAX_DAILY_ATTEMPTS\s*=\s*96;/.test(await scriptResponse.text()),true,'deployed_daily_ceiling_not_verified');
          console.log('DAILY_RECOVERY_CEILING_96_DEPLOYED_VERIFIED');
          await new Promise((resolve,reject)=>{
            let child,done=false,cycles=0;
            const finish=error=>{if(done)return;done=true;clearTimeout(timer);try{process.kill(-child.pid,'SIGINT');}catch{}if(error)reject(error);else resolve();};
            const timer=setTimeout(()=>finish(new Error('runtime_verification_timeout')),37*60000);
            const consume=jsonStream(event=>{
              for(const log of event.logs??[])for(const value of log.message??[]){
                let summary;try{summary=JSON.parse(value);}catch{continue;}
                if(summary.mode==='recover'&&summary.tasks?.length===7){
                  const checkedAt=new Date(summary.checkedAt);
                  if(!Number.isFinite(+checkedAt)||checkedAt.getUTCMinutes()%15!==0)continue;
                  if(event.event?.cron&&event.event.cron!=='*/15 * * * *')continue;
                  if(event.outcome!=='ok')return finish(new Error('runtime_invocation_failed'));
                  if(!Number.isInteger(summary.githubRequests)||summary.githubRequests>48)return finish(new Error('runtime_request_budget_invalid'));
                  if(summary.tasks.some(task=>task.status==='unknown'))return finish(new Error('runtime_reads_not_verified'));
                  const action=summary.action;
                  if(action?.task&&!['1','2','3','4','5','6','7'].includes(action.task))return finish(new Error('runtime_scope_invalid'));
                  cycles++;console.log('SCHEDULED_RECOVERY_CYCLE_VERIFIED');
                  if(action?.outcome==='accepted_waiting_for_fresh_evidence')console.log('AUTOMATIC_RECOVERY_COMMAND_ACCEPTED');
                  if(cycles>=1){console.log('FIFTEEN_MINUTE_AUTOMATIC_RECOVERY_RUNTIME_VERIFIED');finish();}
                }
                if(summary.event==='watchdog_failed')finish(new Error('runtime_check_failed'));
              }
            });
            child=spawn('npx',['--yes','--package=wrangler@4.158.0','--','wrangler','tail',worker,'--format=json'],
              {detached:true,stdio:['ignore','pipe','pipe'],env:{...process.env,CLOUDFLARE_ACCOUNT_ID:account}});
            child.stdout.setEncoding('utf8');child.stdout.on('data',consume);
            child.stderr.on('data',()=>{});
            child.on('error',()=>finish(new Error('runtime_tail_unavailable')));
            child.on('exit',()=>{if(!done)finish(new Error('runtime_tail_ended'));});
          });
          JS
