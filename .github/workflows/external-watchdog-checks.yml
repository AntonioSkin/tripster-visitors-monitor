name: External watchdog checks

on:
  push:
    paths: ['external_watchdog/**', 'watchdog_verification/**', '.github/workflows/external-watchdog-checks.yml']
  pull_request:
    paths: ['external_watchdog/**', 'watchdog_verification/**', '.github/workflows/external-watchdog-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate controller safety and observation
        run: node --test external_watchdog/test/*.test.mjs watchdog_verification/test/*.test.mjs
      - name: Diagnose only the two-repository read access from this temporary branch
        if: github.ref == 'refs/heads/cloudflare/diagnose-read-access'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WATCHDOG_GITHUB_TOKEN: ${{ secrets.WATCHDOG_GITHUB_TOKEN }}
        run: node external_watchdog/deployment-preflight.mjs
      - name: Read the already approved Cloudflare observation logs from this temporary branch
        if: github.ref == 'refs/heads/cloudflare/diagnose-read-access'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node watchdog_verification/observation.mjs
