name: Tripster seat alerts
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'seats/**'
      - '.github/workflows/seats.yml'
      - 'workflow_support/**'
      - '.github/workflows/save-monitor-results.yml'
permissions:
  contents: write
concurrency:
  group: tripster-task-2
  queue: max
  cancel-in-progress: false
jobs:
  seats:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      changed: ${{ steps.upload.outcome == 'success' && steps.package.outputs.changed == 'true' }}
      artifact: ${{ steps.package.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test seat parsing and alert deduplication
        run: python -m unittest seats.test_monitor -v
      - name: Install browser
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check seats and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m seats.monitor
      - name: Package changed task 2 data and delivery state
        id: package
        if: always()
        run: python -m workflow_support.persistence export --task 2 --directory "$RUNNER_TEMP/monitor-bundle"
      - name: Preserve results for the serialized writer
        id: upload
        if: ${{ always() && steps.package.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ runner.temp }}/monitor-bundle/
          if-no-files-found: error
          retention-days: 14
  save:
    needs: seats
    if: ${{ always() && needs.seats.outputs.changed == 'true' }}
    uses: ./.github/workflows/save-monitor-results.yml
    with:
      task: '2'
      artifact: ${{ needs.seats.outputs.artifact }}
    secrets:
      HEALTHCHECKS_API_KEY: ${{ secrets.HEALTHCHECKS_API_KEY }}
