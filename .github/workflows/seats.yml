# Recheck calendar after user changed November availability.
name: Tripster seat alerts
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['seats/**', '.github/workflows/seats.yml']
permissions:
  contents: write
concurrency:
  group: tripster-visitors
  cancel-in-progress: false
jobs:
  seats:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test seat parsing and alert deduplication
        run: python -m unittest seats.test_monitor -v
      - name: Install browser
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check seats and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m seats.monitor
      - name: Save seat state
        id: save_seats
        if: ${{ always() }}
        run: |
          if [ ! -d data/seats ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seats
          if [ -f reports/seats.md ]; then git add reports/seats.md; fi
          if ! git diff --cached --quiet; then
            git commit -m "Save Tripster seat observation and alert state"
            git push
          fi

      - name: Confirm task 2 to external Healthchecks
        if: ${{ always() && steps.save_seats.outcome == 'success' }}
        env:
          HEALTHCHECKS_API_KEY: ${{ secrets.HEALTHCHECKS_API_KEY }}
        run: python -m health.external 2
