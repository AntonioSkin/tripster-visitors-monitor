name: Inspect seat calendar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['seats/probe.py', '.github/workflows/seats.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - run: python seats/probe.py
