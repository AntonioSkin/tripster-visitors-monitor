name: Backup monitoring dispatch
on:
  schedule:
    - cron: '9,29,49 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['workflow_support/**', '.github/workflows/backup-monitoring.yml']
permissions:
  contents: read
  actions: write
concurrency:
  group: monitor-backup-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dispatch only due tasks without an active or queued run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m workflow_support.dispatch
