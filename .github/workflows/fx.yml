name: RUB KZT monitoring
on:
  schedule:
    - cron: '0 6,15 * * *'
    - cron: '20,40 6,7,15,16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fx/**'
      - '.github/workflows/fx.yml'
      - 'workflow_support/**'
      - '.github/workflows/save-monitor-results.yml'
permissions:
  contents: write
concurrency:
  group: tripster-task-4
  queue: max
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.package.outputs.changed }}
      artifact: ${{ steps.package.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test currency rules
        run: python -m unittest fx.test_monitor -v
      - name: Collect quote and notify on change
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m fx.monitor
      - name: Package changed task 4 data and delivery state
        id: package
        if: always()
        run: python -m workflow_support.persistence export --task 4 --directory "$RUNNER_TEMP/monitor-bundle"
      - name: Preserve results for the serialized writer
        if: ${{ always() && steps.package.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ runner.temp }}/monitor-bundle/
          if-no-files-found: error
          retention-days: 14
  save:
    needs: history
    if: ${{ always() && needs.history.outputs.changed == 'true' }}
    uses: ./.github/workflows/save-monitor-results.yml
    with:
      task: '4'
      artifact: ${{ needs.history.outputs.artifact }}
    secrets:
      HEALTHCHECKS_API_KEY: ${{ secrets.HEALTHCHECKS_API_KEY }}
