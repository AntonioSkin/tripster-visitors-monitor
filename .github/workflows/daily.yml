name: Daily visitors
on:
  schedule:
    - cron: '7,27,47 * * * *' # UTC: frequent wakeups; actual Almaty time checked in Python
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'excursions.json'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'

permissions:
  contents: write

concurrency:
  group: tripster-visitors
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COLLECT_NOW: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[collect-now]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check collection and delivery rules
        run: python -m unittest -v
      - name: Check daily delivery eligibility
        id: gate
        run: python delivery_policy.py
      - name: Install dependencies
        if: steps.gate.outputs.collect == 'true' || env.COLLECT_NOW == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Collect live counters
        if: steps.gate.outputs.collect == 'true' || env.COLLECT_NOW == 'true'
        id: collect
        run: python monitor.py
      - name: Send Telegram report
        if: ${{ always() && steps.collect.outputs.snapshot != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SNAPSHOT_PATH: ${{ steps.collect.outputs.snapshot }}
        run: python telegram_report.py "$SNAPSHOT_PATH"
      - name: Save observations and delivery receipt
        id: save_visitors
        if: ${{ always() && steps.collect.outputs.snapshot != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if ! git diff --cached --quiet; then
            git commit -m "Save Tripster counters and Telegram delivery receipt"
            git push
          fi

      - name: Confirm task 1 to external Healthchecks
        if: ${{ always() && steps.save_visitors.outcome == 'success' }}
        env:
          HEALTHCHECKS_API_KEY: ${{ secrets.HEALTHCHECKS_API_KEY }}
        run: python -m health.external 1

      - name: Install seat monitor browser
        if: ${{ always() && github.event_name != 'push' }}
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Backup seat check
        if: ${{ always() && github.event_name != 'push' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m seats.monitor
      - name: Save backup seat check
        id: save_seats
        if: ${{ always() && github.event_name != 'push' }}
        run: |
          if [ ! -d data/seats ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seats
          if [ -f reports/seats.md ]; then git add reports/seats.md; fi
          if ! git diff --cached --quiet; then
            git commit -m "Save backup seat observation and alert state"
            git push
          fi

      - name: Confirm task 2 to external Healthchecks
        if: ${{ always() && steps.save_seats.outcome == 'success' }}
        env:
          HEALTHCHECKS_API_KEY: ${{ secrets.HEALTHCHECKS_API_KEY }}
        run: python -m health.external 2

      - name: Backup daily calendar history
        if: ${{ always() && github.event_name != 'push' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m calendar_history.monitor
      - name: Save backup calendar history
        id: save_calendar
        if: ${{ always() && github.event_name != 'push' }}
        run: |
          if [ ! -d data/calendar_history ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar_history
          if ! git diff --cached --quiet; then
            git commit -m "Save backup daily calendar history"
            git push
          fi

      - name: Confirm task 3 to external Healthchecks
        if: ${{ always() && steps.save_calendar.outcome == 'success' }}
        env:
          HEALTHCHECKS_API_KEY: ${{ secrets.HEALTHCHECKS_API_KEY }}
        run: python -m health.external 3
