name: Daily visitors
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'excursions.json'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'
      - 'workflow_support/**'
      - '.github/workflows/save-monitor-results.yml'
permissions:
  contents: write
concurrency:
  group: tripster-task-1
  queue: max
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.upload.outcome == 'success' && steps.package.outputs.changed == 'true' }}
      artifact: ${{ steps.package.outputs.artifact }}
    env:
      COLLECT_NOW: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[collect-now]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check collection and delivery rules
        run: python -m unittest test_monitor test_delivery_policy test_telegram_report -v
      - name: Check daily delivery eligibility
        id: gate
        run: python delivery_policy.py
      - name: Install dependencies
        if: steps.gate.outputs.collect == 'true' || env.COLLECT_NOW == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Collect live counters
        if: steps.gate.outputs.collect == 'true' || env.COLLECT_NOW == 'true'
        id: collect
        run: python monitor.py
      - name: Send Telegram report
        if: ${{ always() && steps.collect.outputs.snapshot != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SNAPSHOT_PATH: ${{ steps.collect.outputs.snapshot }}
        run: python telegram_report.py "$SNAPSHOT_PATH"
      - name: Package changed task 1 data and delivery state
        id: package
        if: always()
        run: python -m workflow_support.persistence export --task 1 --directory "$RUNNER_TEMP/monitor-bundle"
      - name: Preserve results for the serialized writer
        id: upload
        if: ${{ always() && steps.package.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ runner.temp }}/monitor-bundle/
          if-no-files-found: error
          retention-days: 14
  save:
    needs: collect
    if: ${{ always() && needs.collect.outputs.changed == 'true' }}
    uses: ./.github/workflows/save-monitor-results.yml
    with:
      task: '1'
      artifact: ${{ needs.collect.outputs.artifact }}
    secrets:
      HEALTHCHECKS_API_KEY: ${{ secrets.HEALTHCHECKS_API_KEY }}
