name = "tripster-external-watchdog"
main = "worker.mjs"
compatibility_date = "2026-11-08"
workers_dev = false
preview_urls = false

[vars]
MODE = "recover"
RECOVERY_ALLOWLIST = "1,2,3,4,5,6,7"

[triggers]
crons = ["*/15 * * * *"]

[[durable_objects.bindings]]
name = "WATCHDOG_STATE"
class_name = "WatchdogState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WatchdogState"]

[observability]
enabled = true
