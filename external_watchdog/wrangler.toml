name = "tripster-external-watchdog"
main = "worker.mjs"
compatibility_date = "2026-11-08"
workers_dev = false
preview_urls = false

[vars]
MODE = "observe"
RECOVERY_ALLOWLIST = ""

[triggers]
crons = ["4,14,24,34,44,54 * * * *"]

[[durable_objects.bindings]]
name = "WATCHDOG_STATE"
class_name = "WatchdogState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WatchdogState"]

[observability]
enabled = true
