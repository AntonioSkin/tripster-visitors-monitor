name = "tripster-watchdog-recovery-test"
main = "canary-worker.mjs"
compatibility_date = "2026-11-08"
workers_dev = false
preview_urls = false

[vars]
CANARY_RUN_ID = "__CANARY_RUN_ID__"
CANARY_SHA = "__CANARY_SHA__"

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "CANARY_STATE"
class_name = "CanaryState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CanaryState"]

[observability]
enabled = true
